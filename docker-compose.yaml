# Hostinger Docker Manager — Phumpanya production stack
# Images built by GitHub Actions → GHCR. Traefik terminates TLS.

x-frontend-image: &frontend-image ${FRONTEND_IMAGE:-ghcr.io/chissanupun/ku-bcg-frontend:latest}
x-laravel-image: &laravel-image ${LARAVEL_IMAGE:-ghcr.io/plenglnw1/ku-phumpanya:latest}
x-search-init-image: &search-init-image ${SEARCH_INIT_IMAGE:-ghcr.io/chissanupun/ku-bcg-search-init:latest}

services:
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      laravel:
        condition: service_healthy
    volumes:
      - ./deploy/hostinger/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    # Parallel first deploy: set TRAEFIK_ENABLE=false and uncomment ports below.
    # ports:
    #   - "127.0.0.1:18080:80"
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.http.routers.phumpanya.rule=Host(`${APP_HOST:-plenglnw1.tech}`) || Host(`${WWW_HOST:-www.plenglnw1.tech}`)
      - traefik.http.routers.phumpanya.entrypoints=websecure
      - traefik.http.routers.phumpanya.tls=true
      - traefik.http.routers.phumpanya.tls.certresolver=letsencrypt
      - traefik.http.services.phumpanya.loadbalancer.server.port=80
    restart: unless-stopped
    networks:
      - phumpanya
      - traefik

  frontend:
    image: *frontend-image
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - phumpanya

  laravel:
    image: *laravel-image
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      ELASTICSEARCH_ENABLED: "true"
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      QDRANT_ENABLED: "false"
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
      CACHE_STORE: database
      SESSION_SECURE_COOKIE: "true"
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - phumpanya

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-phumpanya}
      MYSQL_USER: ${DB_USERNAME:-phumpanya}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - phumpanya

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      cluster.routing.allocation.disk.watermark.low: 85%
      cluster.routing.allocation.disk.watermark.high: 90%
      cluster.routing.allocation.disk.watermark.flood_stage: 95%
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - phumpanya

  search-init:
    image: *search-init-image
    profiles: ["init"]
    environment:
      ES_NODE: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - phumpanya
    restart: "no"

networks:
  phumpanya:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  mysql_data:
  elasticsearch_data:
  laravel_storage:
  deploy_backups:
